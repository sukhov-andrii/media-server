services:
  # Streaming service
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: ${PUID}:${PGID} # uid:gid 
    ports:
      - 8096:8096/tcp # jellyfin web app
      - 7359:7359/udp # autodiscovery
    volumes:
      - ./configs/jellyfin-config:/config 
      - ./configs/jellyfin-cache:/cache 
      # MAYBE SAME FOR METADATA?
      - ${DATA_LOCATION}:/data
      # - type: bind
      #   source: /path/to/media2
      #   target: /media2
      #   read_only: true
      # # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /path/to/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - TZ=${TIMEZONE}
      # Something to do with reverse proxy
      # - JELLYFIN_PublishedServerUrl=http://mediaserver.jellyfin.com # JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    devices:
      - /dev/dri:/dev/dri # mapping to support hardware acceleration (?)
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # VPN container
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    # line above must be uncommented to allow external containers to connect.
    # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/connect-a-container-to-gluetun.md#external-container-to-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      - VPN_SERVICE_PROVIDER=protonvpn # ivpn
      - VPN_TYPE=wireguard #openvpn
      # # OpenVPN:
      # - OPENVPN_USER=${OPENVPN_USER}
      # - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Wireguard:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # VPN Server Preferences
      - SERVER_COUNTRIES=Netherlands
      - VPN_PORT_FORWARDING=on
      # - SERVER_CATEGORIES=p2p
      # Timezone for accurate log times
      - TZ=${TIMEZONE}
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      - UPDATER_PERIOD=24h
      # - HTTP_CONTROL_SERVER_ADDRESS=:8000
      # - HTTP_CONTROL_SERVER_PASSWORD={GLUETUN_API_KEY}
    ports:
      # - 8888:8888/tcp # HTTP proxy
      # - 8388:8388/tcp # Shadowsocks
      # - 8388:8388/udp # Shadowsocks
      - 8701:8701 # qBittorrent Web UI
      - 6881:6881 # torrent port
      - 6881:6881/udp
      - 7878:7878 # Radarr
      - 8989:8989 # Sonarr
      - 8686:8686 # Lidarr
      - 6767:6767 # Bazarr
      - 9696:9696 # Prowlarr
      - 8191:8191 # FlareSolverr
      # my personal addition, random check
      # - 8000:8000 # custom Gluetun control server address
    volumes:
      - ./configs/gluetun:/gluetun
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "wget", "-q0", "--spider", "https://ipinfo.io"]
    #   interval: 30s
    #   timeout: 15s
    #   retries: 3
    #   start_period: 20s
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999"]
    #   interval: 30s
    #   timeout: 15s
    #   retries: 4
    #   start_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://ipinfo.io/ip"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Torrent client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
      - WEBUI_PORT=8701 # 8080
      - TORRENTING_PORT=6881
    volumes:
      - ./configs/qbittorrent:/config # /path/to/qbittorrent/appdata:/config
      # - ${DATA_LOCATION}/downloads:/downloads # /path/to/downloads:/downloads #optional
      - ${DATA_LOCATION}:/data
    # ports:
      # NOT USING PORTS, GLUETUN DOES THAT
      # - 8080:8080 ->8701:8701
      # - 6881:6881
      # - 6881:6881/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8701"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Movies downloader
  radarr:
    container_name: radarr
    # hostname: radarr.internal
    image: lscr.io/linuxserver/radarr
    restart: unless-stopped
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    logging:
      driver: json-file
    # ports:
    #   - 7878:7878
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ./configs/radarr:/config
      - ${DATA_LOCATION}:/data

  # Series downloader
  sonarr:
    container_name: sonarr
    # hostname: sonarr.internal
    image: lscr.io/linuxserver/sonarr
    restart: unless-stopped
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    logging:
      driver: json-file
    # ports:
    #   - 8989:8989
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ./configs/sonarr:/config
      - ${DATA_LOCATION}:/data
  
  # Music downloader
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
    volumes:
      - ./configs/lidarr:/config
      - ${DATA_LOCATION}:/data
      # - /path/to/music:/music #optional
      # - /path/to/downloads:/downloads #optional
    # ports:
    #   - 8686:8686
    restart: unless-stopped

  # Subtitles downloader
  bazarr:
    container_name: bazarr
    # hostname: bazarr.internal
    image: lscr.io/linuxserver/bazarr
    restart: unless-stopped
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    logging:
      driver: json-file
    # ports:
    #   - 6767:6767
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ./configs/bazarr:/config
      - ${DATA_LOCATION}:/data
  
  # Download connector
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - TZ=${TIMEZONE}
    volumes:
      - ./configs/prowlarr:/config
    # ports:
    #   - 9696:9696
    restart: unless-stopped
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  # Solver
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun" # Routes all traffic through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      # - LOG_LEVEL=${LOG_LEVEL:-info}
      # - LOG_HTML=${LOG_HTML:-false}
      # - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TIMEZONE}
    # ports:
    #   - "${PORT:-8191}:8191"
    restart: unless-stopped 

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: ${PUID}:${PGID} # 1000:1000
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}  # America/New_York
      # - RADARR_API=${RADARR_API_KEY}
      # - SONARR_API=${SONARR_API_KEY}
    volumes:
      - ./configs/recyclarr:/config

  # Request movie/series
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TIMEZONE}
      - LOG_LEVEL=info
    ports:
      - 5055:5055
    volumes:
      - ./configs/jellyseerr:/app/config
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      jellyfin:
        condition: service_started
      # - gluetun
      # - jellyfin
      # - sonarr
      # - radarr

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    ports:
      - 5690:5690
    volumes:
    - ./configs/wizarr:/data
      # - /path/to/appdata:/data
    environment:
      - PUID=${PUID} #Set UID
      - PGID=${PGID} #Set GID
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)
      - TZ=Europe/Amsterdam

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - 13378:80
    volumes:
      - ${DATA_LOCATION}/media/audiobooks:/audiobooks
      - ${DATA_LOCATION}/media/podcasts:/podcasts
      - ${DATA_LOCATION}/media/books:/books
      - ./configs/audiobookshelf:/config
      - ./metadata/audiobookshelf:/metadata
      # - </path/to/audiobooks>:/audiobooks
      # - </path/to/podcasts>:/podcasts
      # - </path/to/config>:/config
      # - </path/to/metadata>:/metadata
    environment:
      - TZ=${TIMEZONE}

  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: kavita
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./configs/kavita:/kavita/config
      # - ./books:/books
      - ${DATA_LOCATION}/media/books:/books
    environment:
      - TZ=${TIMEZONE} # Europe/Amsterdam
