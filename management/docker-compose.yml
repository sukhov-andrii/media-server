services:
  # Uptime monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ./configs/uptime-kuma:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped

  # # Docker container management tool
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./configs/portainer:/data
  #   ports:
  #     - 9000:9000
  #   restart: unless-stopped

  # # Dashboard
  # glances:
  #   image: nicolargo/glances:latest
  #   container_name: glances
  #   restart: unless-stopped
  #   pid: host
  #   network_mode: host
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   environment:
  #     - GLANCES_OPT=-w    # Run as web server
  #   # Access at http://<server-ip>:61208

  #---------------------------------------------------------------------#
#     Homarr - A simple, yet powerful dashboard for your server.      #
#---------------------------------------------------------------------#
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    ports:
      - '7575:7575'

  #   # Updates docker images on schedule
  # # Date format: seconds minutes hours day-of-month month day-of-week
  # # WARNING: can often break things
  # watchtower:
  #   image: nickfedor/watchtower:latest ## containrrr/watchtower:latest
  #   container_name: watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - TZ=${TIMEZONE}
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_SCHEDULE=0 0 4 1 * *         # Monthly, 1st of the month at 4am
  #     - WATCHTOWER_INCLUDE_RESTARTING=true
  #     - WATCHTOWER_ROLLING_RESTART=true
  #     - WATCHTOWER_NOTIFICATIONS=shoutrrr
  #     - WATCHTOWER_NOTIFICATION_URL=telegram://${TELEGRAM_BOT_TOKEN}@telegram?channels=${TELEGRAM_CHAT_ID}
  #   restart: unless-stopped

  dash:
    container_name: dash
    image: mauricenino/dashdot:latest
    privileged: true
    restart: unless-stopped
    ports:
      # - '80:3001'
      - '8080:3001'
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: "true"

  notifiarr:
    image: golift/notifiarr:latest
    container_name: notifiarr
    restart: unless-stopped
    ports:
      - "5454:5454"
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./configs/notifiarr:/config


# Run with docker compose up -d
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
    - 8081:8080  # was - 8080:8080
    # environment:
      # Uncomment to enable container actions (stop, start, restart). See https://dozzle.dev/guide/actions
      # - DOZZLE_ENABLE_ACTIONS=true
      #
      # Uncomment to allow access to container shells. See https://dozzle.dev/guide/shell
      # - DOZZLE_ENABLE_SHELL=true
      #
      # Uncomment to enable authentication. See https://dozzle.dev/guide/authentication
      # - DOZZLE_AUTH_PROVIDER=simple
      #
      # Label this Dozzle instance (shown in the header and multi-host menu). See https://dozzle.dev/guide/hostname
      # - DOZZLE_HOSTNAME=my-server
      #
      # Connect to one or more remote agents to monitor other Docker hosts. See https://dozzle.dev/guide/agent
      # - DOZZLE_REMOTE_AGENT=192.168.1.10:7007,192.168.1.11:7007
      #
      # Only show containers matching a filter. See https://dozzle.dev/guide/filters
      # - DOZZLE_FILTER=label=com.example.app
volumes:
  dozzle_data: