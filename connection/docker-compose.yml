services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: mediaserver
    network_mode: host          # ← add this
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./configs/tailscale:/var/lib/tailscale
      # - /dev/net/tun:/dev/net/tun  # FIXME: is shared with Gluetun, so may potentially cause problems
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status | grep -q '{TAILSCALE_MEDIASERVER_IP}'"]
      interval: 30s
      timeout: 10s
      retries: 3


  nginx_proxy_manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped

    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    environment:
      TZ: ${TIMEZONE} # "Australia/Brisbane"

      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'

    volumes:
      - ./data/npm_data:/data
      - ./data/npm_letsencrypt:/etc/letsencrypt
      # - ./data/npm_logs:/var/log/nginx
